name: Daily concert check

on:
  schedule:
    # 09:00 / 14:00 / 19:00 Europe/Berlin (Sommerzeit UTC+2 -> 07/12/17 UTC;
    # im Winter (UTC+1) verschieben sich diese Zeiten um -1h nach hinten,
    # z.B. dann 10/15/20 Uhr deutscher Zeit -- bei Bedarf hier anpassen)
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: {}  # manuelles Triggern über den GitHub-UI-Button

concurrency:
  group: daily-concert-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium || true

      - name: Run tracker
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py

      - name: Commit updated known_events.json
        run: |
          git config user.name "koeln-konzert-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add known_events.json index.html
          git diff --quiet --cached || git commit -m "Update known events"
          git push
